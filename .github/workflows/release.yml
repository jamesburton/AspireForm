name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        # Run the xUnit v3 MTP runner directly. `dotnet test` is flaky against
        # MTP-only test projects on some hosts; running the test exe is the
        # authoritative invocation.
        run: dotnet run --project tests/AspireForm.Tests --configuration Release --no-build

      - name: Derive package version from tag
        id: version
        # Strip the leading 'v' from refs/tags/v0.1.0 -> 0.1.0. NuGet then
        # normalises 0.1 -> 0.1.0, so v0.1 / v0.1.0 produce the same package.
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/AspireForm/AspireForm.csproj
          --configuration Release --no-build
          --output ./artifacts
          /p:Version=${{ steps.version.outputs.value }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
